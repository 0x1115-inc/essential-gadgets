openapi: 3.1.0
info:
  title: Gadget Link Booking API
  version: 1.0.0
  summary: Staff booking management API
  description: |
    Booking API specification for the Gadget Link Booking Service.
    This document intentionally includes booking endpoints only.

servers:
  - url: https://apis.0x1115.com/prd-04/v2
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Bookings

paths:
  /api/v2/bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      operationId: listBookings
      security:
        - StaffSessionAuth: []
        - FirebaseBearerAuth: []
      parameters:
        - name: path
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Path'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, canceled]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Bookings]
      summary: Create booking
      operationId: createBooking
      security:
        - StaffSessionAuth: []
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Overlapping booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/bookings/{booking_id}:
    get:
      tags: [Bookings]
      summary: Get booking by ID
      operationId: getBookingById
      security:
        - StaffSessionAuth: []
        - FirebaseBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingIdParam'
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Bookings]
      summary: Update booking
      operationId: updateBooking
      security:
        - StaffSessionAuth: []
        - FirebaseBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Overlapping booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/bookings/{booking_id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking
      operationId: cancelBooking
      security:
        - StaffSessionAuth: []
        - FirebaseBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingIdParam'
      responses:
        '200':
          description: Booking canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    StaffSessionAuth:
      type: apiKey
      in: cookie
      name: session_id
    FirebaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingIdParam:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Path:
      type: string
      pattern: '^[a-z0-9-]{3,64}$'
      example: team-townhall

    BookingStatus:
      type: string
      enum: [scheduled, canceled]

    Booking:
      type: object
      required:
        - id
        - path
        - target_url
        - starts_at_utc
        - ends_at_utc
        - status
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/Path'
        target_url:
          type: string
          format: uri
        starts_at_utc:
          type: string
          format: date-time
        ends_at_utc:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'
        created_by:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [source_link_id, target_url, starts_at, ends_at]        
      properties:
        path:
          $ref: '#/components/schemas/Path'
        target_url:
          type: string
          format: uri
        starts_at_utc:
          type: string
          format: date-time
        ends_at_utc:
          type: string
          format: date-time
      description: Time window semantics are [starts_at_utc, ends_at_utc).

    UpdateBookingRequest:
      type: object
      properties:
        target_url:
          type: string
          format: uri
        starts_at_utc:
          type: string
          format: date-time
        ends_at_utc:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'

    BookingResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Booking'

    BookingListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        meta:
          type: object
          required: [page, page_size]
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: BOOKING_OVERLAP
            message:
              type: string
              example: Booking overlaps with an existing time window.
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string